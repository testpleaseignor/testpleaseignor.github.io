  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ДОСЬЕ -->\n  <section style=\"background:#FFD23F;border-bottom:5px solid #15110E;padding:72px 24px;\">\n    <div style=\"max-width:1000px;margin:0 auto;\">\n      <h2 style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:56px;transform:rotate(-1deg);margin-bottom:8px;\">ДОСЬЕ 📋<\u002Fh2>\n      <p style=\"font-weight:600;font-size:18px;margin-bottom:36px;\">всё, что нужно знать о легенде<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:22px;\">\n        <sc-for list=\"{{ dossier }}\" as=\"row\" hint-placeholder-count=\"6\">\n          <div style=\"background:#fff;border:5px solid #15110E;padding:22px 24px;box-shadow:7px 7px 0 #15110E;\">\n            <div style=\"font-family:'Unbounded',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;color:#FF5DA2;letter-spacing:1px;\">{{ row.k }}<\u002Fdiv>\n            <div style=\"font-family:'Unbounded',sans-serif;font-weight:700;font-size:24px;margin-top:6px;\">{{ row.v }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ФАКТЫ -->\n  <section style=\"background:#43D9E8;border-bottom:5px solid #15110E;padding:72px 24px;\">\n    <div style=\"max-width:1000px;margin:0 auto;\">\n      <h2 style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:56px;text-align:center;transform:rotate(1deg);margin-bottom:40px;\">ЧЕМ ОН ЗАНЯТ 🐾<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;\">\n        <sc-for list=\"{{ facts }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <div style=\"background:{{ f.bg }};border:5px solid #15110E;padding:28px 22px;box-shadow:7px 7px 0 #15110E;transform:rotate({{ f.rot }});\">\n            <div style=\"font-size:48px;line-height:1;\">{{ f.emoji }}<\u002Fdiv>\n            <div style=\"font-family:'Unbounded',sans-serif;font-weight:700;font-size:22px;margin-top:14px;\">{{ f.title }}<\u002Fdiv>\n            <p style=\"font-weight:500;font-size:16px;line-height:1.45;margin-top:8px;\">{{ f.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ЦИТАТЫ -->\n  <section style=\"background:#B8F034;border-bottom:5px solid #15110E;padding:72px 24px;\">\n    <div style=\"max-width:900px;margin:0 auto;\">\n      <h2 style=\"font-family:'Unbounded',sans-serif;font-weight:900;font-size:56px;margin-bottom:40px;\">ЕГО МЫСЛИ 💭<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:22px;\">\n        <sc-for list=\"{{ quotes }}\" as=\"q\" hint-placeholder-count=\"4\">\n          <div style=\"background:#fff;border:5px solid #15110E;padding:24px 28px;box-shadow:7px 7px 0 #15110E;display:flex;gap:18px;align-items:center;\">\n            <div style=\"font-size:40px;\">{{ q.face }}<\u002Fdiv>\n            <div style=\"font-family:'Unbounded',sans-serif;font-weight:600;font-size:21px;line-height:1.3;\">«{{ q.text }}»<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background:#15110E;color:#FFF8EC;padding:64px 24px;text-align:center;\">\n    <button onclick=\"{{ meow }}\" style=\"cursor:pointer;background:#FF5DA2;border:5px solid #FFF8EC;color:#15110E;font-family:'Unbounded',sans-serif;font-weight:900;font-size:28px;padding:16px 40px;box-shadow:6px 6px 0 #43D9E8;transition:transform .08s,box-shadow .08s;\" style-active=\"transform:translate(6px,6px);box-shadow:0 0 0 #43D9E8;\">ещё разок МЯВ 🔊<\u002Fbutton>\n    <p style=\"font-family:'Unbounded',sans-serif;font-weight:700;font-size:20px;margin-top:32px;\">МЕГАТРОН © навсегда<\u002Fp>\n    <p style=\"font-weight:500;font-size:15px;margin-top:10px;opacity:0.7;\">сделано с любовью и испугом · ни один кирпич не пострадал<\u002Fp>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { count: 0 };\n\n  ctx() {\n    if (!this._ac) {\n      const AC = window.AudioContext || window.webkitAudioContext;\n      this._ac = new AC();\n    }\n    if (this._ac.state === 'suspended') this._ac.resume();\n    return this._ac;\n  }\n\n  // synthesize a playful \"mrrow\"\n  meow = () => {\n    const ac = this.ctx();\n    const t0 = ac.currentTime;\n    const dur = 0.55 + Math.random() * 0.15;\n\n    const master = ac.createGain();\n    master.gain.value = 0.0001;\n    master.connect(ac.destination);\n    master.gain.setValueAtTime(0.0001, t0);\n    master.gain.exponentialRampToValueAtTime(0.5, t0 + 0.05);\n    master.gain.setValueAtTime(0.5, t0 + dur * 0.6);\n    master.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);\n\n    // formant-ish bandpass\n    const bp = ac.createBiquadFilter();\n    bp.type = 'bandpass';\n    bp.Q.value = 6;\n    bp.frequency.setValueAtTime(900, t0);\n    bp.frequency.linearRampToValueAtTime(1500, t0 + dur * 0.35);\n    bp.frequency.linearRampToValueAtTime(700, t0 + dur);\n    bp.connect(master);\n\n    const base = 460 + Math.random() * 120;\n    const osc = ac.createOscillator();\n    osc.type = 'sawtooth';\n    osc.frequency.setValueAtTime(base * 0.8, t0);\n    osc.frequency.linearRampToValueAtTime(base * 1.25, t0 + dur * 0.3);\n    osc.frequency.linearRampToValueAtTime(base * 0.7, t0 + dur);\n\n    // vibrato\n    const lfo = ac.createOscillator();\n    lfo.frequency.value = 16;\n    const lfoGain = ac.createGain();\n    lfoGain.gain.value = base * 0.06;\n    lfo.connect(lfoGain);\n    lfoGain.connect(osc.frequency);\n\n    osc.connect(bp);\n\n    // second harmonic layer\n    const osc2 = ac.createOscillator();\n    osc2.type = 'triangle';\n    osc2.frequency.setValueAtTime(base * 1.6, t0);\n    osc2.frequency.linearRampToValueAtTime(base * 2.5, t0 + dur * 0.3);\n    osc2.frequency.linearRampToValueAtTime(base * 1.4, t0 + dur);\n    const g2 = ac.createGain();\n    g2.gain.value = 0.35;\n    osc2.connect(g2);\n    g2.connect(bp);\n\n    osc.start(t0); osc2.start(t0); lfo.start(t0);\n    osc.stop(t0 + dur); osc2.stop(t0 + dur); lfo.stop(t0 + dur);\n\n    this.setState(s => ({ count: s.count + 1 }));\n  };\n\n  renderVals() {\n    return {\n      count: this.state.count,\n      meow: this.meow,\n      dossier: [\n        { k: 'Имя', v: 'Мегатрон' },\n        { k: 'Профессия', v: 'Орать' },\n        { k: 'Локация', v: 'Чёрный стул' },\n        { k: 'Настроение', v: 'Возмущён' },\n        { k: 'Любимый звук', v: 'Свой' },\n        { k: 'Статус', v: 'Легенда' },\n      ],\n      facts: [\n        { emoji: '🗣️', title: 'Орёт', body: 'Громко, по делу и без. Кирпичная стена слушает молча.', bg: '#FFD23F', rot: '-2deg' },\n        { emoji: '🪑', title: 'Сидит', body: 'Стул — его трон. Поцарапанный, но свой. Никому не уступит.', bg: '#FF5DA2', rot: '1.5deg' },\n        { emoji: '👁️', title: 'Смотрит', body: 'Прямо в душу. С прищуром. Знает про тебя всё.', bg: '#B8F034', rot: '-1deg' },\n      ],\n      quotes: [\n        { face: '😾', text: 'Где еда. Я спрашиваю — где. Еда.' },\n        { face: '🙀', text: 'Это мой стул. Это всегда был мой стул.' },\n        { face: '😼', text: 'Я не толстый, я пушистый и важный.' },\n        { face: '😹', text: 'МЯ-Я-Я-ЯВ (перевод: доброе утро, раб).' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
